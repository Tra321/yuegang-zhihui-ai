server:
  port: ${YGH_SYSTEM_PORT:8083}
  shutdown: graceful
spring:
  application:
    name: ygh-system-service
  datasource:
    url: ${YGH_SYSTEM_DB_URL}
    username: ${YGH_SYSTEM_DB_APP_USERNAME:ygh_system_app}
    password: ${YGH_SYSTEM_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${YGH_SYSTEM_DB_POOL_MAX_SIZE:5}
      minimum-idle: ${YGH_SYSTEM_DB_POOL_MIN_IDLE:1}
  flyway:
    url: ${YGH_SYSTEM_DB_URL}
    user: ${YGH_SYSTEM_DB_MIGRATION_USERNAME:ygh_system_migration}
    password: ${YGH_SYSTEM_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  cloud:
    nacos:
      discovery:
        server-addr: ${YGH_NACOS_SERVER_ADDR}
        username: ${YGH_NACOS_USERNAME}
        password: ${YGH_NACOS_PASSWORD}
        namespace: ${YGH_NACOS_NAMESPACE:ygh-dev}
        group: ${YGH_NACOS_DISCOVERY_GROUP:YGH_GROUP}
        ip: ${YGH_SYSTEM_ADVERTISE_IP:}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
ygh:
  internal-request.hmac-base64: ${YGH_INTERNAL_REQUEST_HMAC_BASE64}
  system.config-master-key-base64: ${YGH_SYSTEM_CONFIG_MASTER_KEY_BASE64}
management.endpoints.web.exposure.include: health,info,metrics,prometheus
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: when-authorized
management.metrics.tags.application: ${spring.application.name}
