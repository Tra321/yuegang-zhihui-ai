server.port: ${YGH_INVENTORY_PORT:8085}
spring:
  application.name: ygh-inventory-service
  datasource:
    url: ${YGH_INVENTORY_DB_URL}
    username: ${YGH_INVENTORY_DB_APP_USERNAME:ygh_inventory_app}
    password: ${YGH_INVENTORY_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    url: ${YGH_INVENTORY_DB_URL}
    user: ${YGH_INVENTORY_DB_MIGRATION_USERNAME:ygh_inventory_migration}
    password: ${YGH_INVENTORY_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
  cloud.nacos.discovery:
    server-addr: ${YGH_NACOS_SERVER_ADDR}
    username: ${YGH_NACOS_USERNAME}
    password: ${YGH_NACOS_PASSWORD}
    namespace: ${YGH_NACOS_NAMESPACE:ygh-dev}
    group: ${YGH_NACOS_DISCOVERY_GROUP:YGH_GROUP}
management.endpoints.web.exposure.include: health,info,metrics,prometheus
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: when-authorized
management.metrics.tags.application: ${spring.application.name}
ygh.internal-request.hmac-base64: ${YGH_INTERNAL_REQUEST_HMAC_BASE64}
