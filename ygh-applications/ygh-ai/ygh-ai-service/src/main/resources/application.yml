server.port: ${YGH_AI_PORT:8090}
spring:
  application.name: ygh-ai-service
  datasource:
    url: ${YGH_AI_DB_URL}
    username: ${YGH_AI_DB_APP_USERNAME:ygh_ai_app}
    password: ${YGH_AI_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    url: ${YGH_AI_DB_URL}
    user: ${YGH_AI_DB_MIGRATION_USERNAME:ygh_ai_migration}
    password: ${YGH_AI_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
  cloud.nacos.discovery:
    server-addr: ${YGH_NACOS_SERVER_ADDR}
    username: ${YGH_NACOS_USERNAME}
    password: ${YGH_NACOS_PASSWORD}
    namespace: ${YGH_NACOS_NAMESPACE:ygh-dev}
    group: ${YGH_NACOS_DISCOVERY_GROUP:YGH_GROUP}
ygh:
  internal-request.hmac-base64: ${YGH_INTERNAL_REQUEST_HMAC_BASE64}
  ai:
    system-base-url: ${YGH_SYSTEM_INTERNAL_BASE_URL}
    search-base-url: ${YGH_SEARCH_INTERNAL_BASE_URL}
    product-base-url: ${YGH_PRODUCT_INTERNAL_BASE_URL}
    inventory-base-url: ${YGH_INVENTORY_INTERNAL_BASE_URL}
    order-base-url: ${YGH_ORDER_INTERNAL_BASE_URL}
management.endpoints.web.exposure.include: health,info,metrics,prometheus
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: when-authorized
management.metrics.tags.application: ${spring.application.name}
