server.port: ${YGH_KNOWLEDGE_PORT:8088}
spring:
  application.name: ygh-knowledge-service
  servlet.multipart:
    max-file-size: 50MB
    max-request-size: 52MB
  datasource:
    url: ${YGH_KNOWLEDGE_DB_URL}
    username: ${YGH_KNOWLEDGE_DB_APP_USERNAME:ygh_knowledge_app}
    password: ${YGH_KNOWLEDGE_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    url: ${YGH_KNOWLEDGE_DB_URL}
    user: ${YGH_KNOWLEDGE_DB_MIGRATION_USERNAME:ygh_knowledge_migration}
    password: ${YGH_KNOWLEDGE_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
  cloud.nacos.discovery:
    server-addr: ${YGH_NACOS_SERVER_ADDR}
    username: ${YGH_NACOS_USERNAME}
    password: ${YGH_NACOS_PASSWORD}
    namespace: ${YGH_NACOS_NAMESPACE:ygh-dev}
    group: ${YGH_NACOS_DISCOVERY_GROUP:YGH_GROUP}
ygh.knowledge.storage-root: ${YGH_KNOWLEDGE_STORAGE_ROOT}
ygh.knowledge.search-base-url: ${YGH_SEARCH_INTERNAL_BASE_URL}
management.endpoints.web.exposure.include: health,info,metrics,prometheus
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: when-authorized
management.metrics.tags.application: ${spring.application.name}
ygh.mq.enabled: ${YGH_MQ_ENABLED:false}
ygh.mq.nameserver: ${YGH_ROCKETMQ_NAMESERVER:127.0.0.1:9876}
ygh.mq.topic: ${YGH_ROCKETMQ_TOPIC:YGH_DOMAIN_EVENTS}
