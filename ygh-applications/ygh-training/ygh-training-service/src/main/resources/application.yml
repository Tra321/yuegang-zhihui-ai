server.port: ${YGH_TRAINING_PORT:8091}
spring:
  application.name: ygh-training-service
  datasource:
    url: ${YGH_TRAINING_DB_URL}
    username: ${YGH_TRAINING_DB_APP_USERNAME:ygh_training_app}
    password: ${YGH_TRAINING_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    url: ${YGH_TRAINING_DB_URL}
    user: ${YGH_TRAINING_DB_MIGRATION_USERNAME:ygh_training_migration}
    password: ${YGH_TRAINING_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
  cloud.nacos.discovery:
    server-addr: ${YGH_NACOS_SERVER_ADDR}
    username: ${YGH_NACOS_USERNAME}
    password: ${YGH_NACOS_PASSWORD}
    namespace: ${YGH_NACOS_NAMESPACE:ygh-dev}
    group: ${YGH_NACOS_DISCOVERY_GROUP:YGH_GROUP}
ygh.internal-request.hmac-base64: ${YGH_INTERNAL_REQUEST_HMAC_BASE64}
ygh.training.storage-root: ${YGH_TRAINING_STORAGE_ROOT}
ygh.training.user-base-url: ${YGH_USER_INTERNAL_BASE_URL:http://ygh-user-service:8082}
ygh.mq.enabled: ${YGH_MQ_ENABLED:false}
ygh.mq.nameserver: ${YGH_ROCKETMQ_NAMESERVER:127.0.0.1:9876}
ygh.mq.topic: ${YGH_ROCKETMQ_TOPIC:YGH_DOMAIN_EVENTS}
spring.servlet.multipart.max-file-size: 50MB
spring.servlet.multipart.max-request-size: 52MB
management.endpoints.web.exposure.include: health,info,metrics,prometheus
management.endpoint.health.probes.enabled: true
management.endpoint.health.show-details: when-authorized
management.metrics.tags.application: ${spring.application.name}
